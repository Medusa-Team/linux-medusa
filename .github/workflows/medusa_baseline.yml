name: Medusa baseline

on:
  pull_request:
  push:
    branches:
      - master
      - codex/medusa-revival-phase-0

permissions:
  contents: read

jobs:
  x86-build:
    name: Linux 6.11 x86-64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential flex libelf-dev libssl-dev
      - name: Prepare the checked-in Medusa configuration
        run: |
          mkdir build
          cp .config build/.config
          make O=build olddefconfig
      - name: Build the bootable kernel and modules
        run: make O=build -j2 bzImage modules

  uml-kunit:
    name: UML KUnit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install UML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc bison build-essential flex libelf-dev libssl-dev
      - name: Run Medusa KUnit suites
        run: |
          python3 tools/testing/kunit/kunit.py run \
            --arch=um \
            --kunitconfig=.kunitconfig
