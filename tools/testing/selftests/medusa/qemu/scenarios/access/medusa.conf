tree "fs" clone of file by getfile getfile.filename;
primary tree "fs";
tree "domain" of process;

space all_domains = recursive "domain";
space all_files = recursive "/";

all_domains	ENTER	all_domains,
		READ	all_domains, all_files,
		WRITE	all_domains, all_files,
		SEE	all_domains, all_files;

function log
{
	local printk buf.message=$1 + "\n";
	update buf;
}

* getprocess * {
	enter(process, @"domain/init");
	/* Subject-triggered exec/set-id events are boot-sensitive today. */
	process.med_sact = 0;
	return ALLOW;
}

* getfile * {
	file.med_oact = 0x3fffffff;
	file.vs = space all_files;
	return ALLOW;
}

* getipc * {
	ipc.med_oact = 0x3fffffff;
	ipc.vs = space all_files;
	return ALLOW;
}

* pexec * { log("MEDUSA_EVENT pexec"); return ALLOW; }
* fexec * { log("MEDUSA_EVENT fexec"); return ALLOW; }
* setresuid { log("MEDUSA_EVENT setresuid"); return ALLOW; }
* mkdir * { log("MEDUSA_EVENT mkdir"); return ALLOW; }
* mknod * { log("MEDUSA_EVENT mknod"); return ALLOW; }
* open * {
	log("MEDUSA_EVENT open");
	file.vs = space all_files;
	update file;
	return ALLOW;
}
* chmod * { log("MEDUSA_EVENT chmod"); return ALLOW; }
* chown * { log("MEDUSA_EVENT chown"); return ALLOW; }
* fcntl * { log("MEDUSA_EVENT fcntl"); return ALLOW; }
* truncate * { log("MEDUSA_EVENT truncate"); return ALLOW; }
* symlink * { log("MEDUSA_EVENT symlink"); return ALLOW; }
* link * { log("MEDUSA_EVENT link"); return ALLOW; }
* rename * { log("MEDUSA_EVENT rename"); return ALLOW; }
* unlink * { log("MEDUSA_EVENT unlink"); return ALLOW; }
* rmdir * { log("MEDUSA_EVENT rmdir"); return ALLOW; }
* chroot * { log("MEDUSA_EVENT chroot"); return ALLOW; }
* ipc_perm * { log("MEDUSA_EVENT ipc_perm"); return ALLOW; }
* ipc_ctl * { log("MEDUSA_EVENT ipc_ctl"); return ALLOW; }
* ipc_associate * { log("MEDUSA_EVENT ipc_associate"); return ALLOW; }
* ipc_semop * { log("MEDUSA_EVENT ipc_semop"); return ALLOW; }
* ipc_shmat * { log("MEDUSA_EVENT ipc_shmat"); return ALLOW; }
* ipc_msgsnd * { log("MEDUSA_EVENT ipc_msgsnd"); return ALLOW; }
* ipc_msgrcv * { log("MEDUSA_EVENT ipc_msgrcv"); return ALLOW; }

function _init
{
}
